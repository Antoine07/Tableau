<svg xmlns="http://www.w3.org/2000/svg" width="960" height="476" viewBox="0 0 960 476" role="img" aria-labelledby="title desc">
<title id="title">Lignes, commandes et dénominateurs</title><desc id="desc">C001 contient deux lignes à 90 et 30 euros. C002 contient une ligne à 180 euros. COUNTD de Commande vaut 2 ; COUNTD de Ventes vaut 3. Total 300 euros, moyenne de ligne 100 euros, panier moyen 150 euros.</desc>
<style>text{font:18px Arial,sans-serif;fill:#203b36}.head{font-weight:bold}.small{font-size:15px;fill:#52685c}.result{font-size:28px;font-weight:bold}</style>
<rect width="960" height="476" rx="18" fill="#edf1e3"/><text x="26" y="36" class="head">UN MÊME REVENU, DEUX DÉNOMINATEURS</text><text x="26" y="63" class="small">Exemple pédagogique indépendant du fichier du TP.</text>
<rect x="25" y="88" width="390" height="276" rx="14" fill="white" stroke="#cbd5bf"/><text x="46" y="120" class="head">Ligne</text><text x="155" y="120" class="head">Commande</text><text x="318" y="120" class="head">Ventes</text><path d="M45 136H395" stroke="#cbd5bf"/>
<rect x="145" y="145" width="125" height="91" rx="9" fill="#deebf4"/><rect x="145" y="241" width="125" height="34" rx="7" fill="#edf1e3"/><text x="46" y="175">L01</text><text x="155" y="175">C001</text><text x="318" y="175">90 €</text><text x="46" y="220">L02</text><text x="155" y="220">C001</text><text x="318" y="220">30 €</text><text x="46" y="265">L03</text><text x="155" y="265">C002</text><text x="308" y="265">180 €</text><path d="M45 286H395" stroke="#cbd5bf"/><text x="46" y="328" class="head">3 lignes · 2 commandes · 300 €</text>
<path d="M430 219H473m-10-10 10 10-10 10" fill="none" stroke="#28604e" stroke-width="3"/>
<rect x="490" y="88" width="444" height="128" rx="14" fill="white" stroke="#cbd5bf"/><text x="510" y="119" class="head">Moyenne des ventes par ligne</text><text x="510" y="159" class="result">300 / 3 = 100 €</text><text x="510" y="192" class="small">AVG([Ventes]) · moyenne des trois lignes</text>
<rect x="490" y="236" width="444" height="128" rx="14" fill="#e1f18d" stroke="#b6cc74"/><text x="510" y="267" class="head">Panier moyen par commande</text><text x="510" y="307" class="result">300 / 2 = 150 €</text><text x="510" y="340" class="small">SUM([Ventes]) / COUNTD([Commande])</text>
<text x="26" y="407" class="head">COUNTD([Commande]) = 2 : C001, C002</text><text x="26" y="441" class="head">COUNTD([Ventes]) = 3 : 90, 30, 180</text></svg>
